# Ce workflow est versionné mais dormant : le dépôt n'a pas encore de remote.
# Il appelle `pnpm ci:local` et rien d'autre — le pipeline est défini une seule
# fois, dans le package.json racine, et le hook pre-push de lefthook exécute
# exactement la même chose. Aucune divergence possible entre local et distant.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.11', '22', '24']

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run ci:local
