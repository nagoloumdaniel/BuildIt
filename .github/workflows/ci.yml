# DORMANT — la CI GitHub n'est pas disponible pour ce dépôt. L'intégration
# continue est locale : le hook pre-push de lefthook (ci:local, et le test de
# fumée quand le push touche generator, registry ou recipes).
#
# Ce fichier est gardé prêt à servir : il n'appelle que les scripts du
# package.json racine, donc il ne peut pas diverger du local. Pour le
# réactiver, remettre les déclencheurs push (main) et pull_request.

name: CI

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.11', '22', '24']

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run ci:local

  # Gate M3 : génère de vrais projets, les installe depuis npm et lance les
  # scripts que leur propre CI lancera. Réseau requis, d'où un job à part —
  # le pre-push ne l'exécute pas.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run test:smoke
