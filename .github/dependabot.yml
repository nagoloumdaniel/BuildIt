version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - '@biomejs/*'
          - '@changesets/*'
          - '@commitlint/*'
          - 'secretlint'
          - '@secretlint/*'
          - 'lefthook'
          - 'tsdown'
          - 'turbo'
          - 'vitest'
      types:
        patterns:
          - '@types/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
