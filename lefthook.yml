# Garde-fous locaux. La CI GitHub n'est pas disponible pour ce dépôt : ces
# hooks SONT l'intégration continue. Rien ne part sur le remote sans être
# passé par pre-push.

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,mts,cts,json,jsonc}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - name: secrets
      run: pnpm exec secretlint --maskSecrets {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: ci-local
      run: pnpm run ci:local

    # Le test de fumée génère, installe (réseau) et construit de vrais projets :
    # environ une minute, plus l'aller-retour en base si Docker répond. Il ne
    # tourne que si le push touche ce qui change un projet généré.
    # Hors-ligne : LEFTHOOK_EXCLUDE=smoke git push — et le dire dans la PR.
    - name: smoke
      glob: "packages/{generator,registry,recipes}/**"
      run: pnpm run test:smoke
